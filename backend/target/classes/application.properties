server.port=8080

spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

app.cors.allowed-origins=https://editor-next.swagger.io,http://localhost,http://127.0.0.1,http://localhost:8080,http://192.168.75.124,https://192.168.75.124,http://192.168.75.124:8080,http://localhost:5173,http://127.0.0.1:5173
app.security.token-secret=uniflow-dev-secret-change-in-production
app.security.token-ttl-seconds=7200
